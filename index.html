<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ad Dashboard</title>

<!-- Monetag Ad Script -->
<script src='//libtl.com/sdk.js' data-zone='10832265' data-sdk='show_10832265'></script>

<style>
body{
    font-family: Arial;
    background:#0f172a;
    color:#fff;
    text-align:center;
    margin:0;
}
.container{
    max-width:350px;
    margin:40px auto;
    padding:20px;
}
.card{
    background:#1e293b;
    padding:15px;
    border-radius:10px;
}
button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#4a6bff;
    color:white;
    font-size:16px;
}
</style>
</head>

<body>

<div class="container">

<h2>🔥 EMRAN HOSSAIN Dashboard</h2>

<div class="card">
<p>👤 User ID: <span id="uid"></span></p>
<p id="status">⏳ Loading Ad...</p>
</div>

<button onclick="showAd()">📢 Show Ad</button>

</div>

<script>

// fallback link
const fallbackLink = "https://omg10.com/4/10838634";

// create user id
let uid = localStorage.getItem("uid");
if(!uid){
    uid = "user_" + Math.floor(Math.random()*999999);
    localStorage.setItem("uid", uid);
}
document.getElementById("uid").innerText = uid;

// check ad ready
function checkAd(){
    if(typeof window.show_10832265 === "function"){
        document.getElementById("status").innerText = "✅ Ad Ready";
    } else {
        setTimeout(checkAd, 1000);
    }
}
checkAd();

// show ad
function showAd(){

    if(typeof window.show_10832265 === "function"){

        document.getElementById("status").innerText = "📢 Showing Ad...";

        window.show_10832265()
        .then(()=>{
            document.getElementById("status").innerText = "✅ Ad Finished";
        })
        .catch(()=>{
            runFallback();
        });

    } else {
        runFallback();
    }
}

// fallback system
function runFallback(){
    document.getElementById("status").innerText = "⚠️ Backup Ad...";
    window.open(fallbackLink, "_blank");
}

</script>

</body>
</html>
