<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pro Ad System</title>

<script src='//libtl.com/sdk.js' data-zone='10842680' data-sdk='show_10842680'></script>

<style>
body{
    font-family: Arial;
    background:#0f172a;
    color:#fff;
    text-align:center;
    margin:0;
}
.box{
    max-width:380px;
    margin:auto;
    padding:20px;
}
.card{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
}
button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:#4a6bff;
    color:white;
    font-size:16px;
}
button:active{
    opacity:0.7;
}
</style>
</head>

<body>

<div class="box">

<h2>🔥 EMRAN HOSSAIN PRO ADS</h2>

<div class="card">
<p>👤 User: <span id="uid"></span></p>
<p id="status">⏳ Loading Ads...</p>
</div>

<button onclick="showRewardAd()">🎁 Rewarded Ad</button>
<button onclick="showPopupAd()">⚡ Popup Ad</button>
<button onclick="startInApp()">📲 Auto Ads</button>

</div>

<script>

// fallback
const fallbackLink = "https://omg10.com/4/10838634";

// user id
let uid = localStorage.getItem("uid");
if(!uid){
    uid = "user_" + Math.floor(Math.random()*999999);
    localStorage.setItem("uid", uid);
}
document.getElementById("uid").innerText = uid;

// check sdk ready
function checkAd(){
    if(typeof window.show_10832265 === "function"){
        document.getElementById("status").innerText = "✅ Ads Ready";
    } else {
        setTimeout(checkAd, 1000);
    }
}
checkAd();

// prevent spam click
let busy = false;

// 🎁 Rewarded Ad
function showRewardAd(){

    if(busy) return;
    busy = true;

    if(typeof window.show_10832265 === "function"){

        document.getElementById("status").innerText = "🎁 Showing Reward Ad...";

        window.show_10832265().then(()=>{
            document.getElementById("status").innerText = "✅ Reward Received 🎉";
            busy = false;
        }).catch(()=>{
            busy = false;
            runFallback();
        });

    } else {
        busy = false;
        runFallback();
    }
}


// ⚡ Popup Ad
function showPopupAd(){

    if(busy) return;
    busy = true;

    if(typeof window.show_10832265 === "function"){

        document.getElementById("status").innerText = "⚡ Opening Popup...";

        window.show_10832265('pop').then(()=>{
            document.getElementById("status").innerText = "✅ Popup Done";
            busy = false;
        }).catch(()=>{
            busy = false;
            runFallback();
        });

    } else {
        busy = false;
        runFallback();
    }
}


// 📲 Auto In-App Ads
function startInApp(){

    if(typeof window.show_10832265 === "function"){

        document.getElementById("status").innerText = "📲 Auto Ads Running";

        window.show_10832265({
            type: 'inApp',
            inAppSettings: {
                frequency: 2,
                capping: 0.1,
                interval: 30,
                timeout: 5,
                everyPage: false
            }
        });

    } else {
        runFallback();
    }
}


// fallback
function runFallback(){
    document.getElementById("status").innerText = "⚠️ Backup Ad...";
    window.open(fallbackLink, "_blank");
}

</script>

</body>
</html>
